name: Cisco Live 🤖🇳🇱 NSO services delivery

on:
  push:
  workflow_dispatch:
    inputs:
      run-tests:
        description: '🤖 Run Robot tests'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      deliver-artifacts:
        description: '📦 Generate artifacts'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:
  set-workflow-options:
    runs-on: self-hosted
    outputs:
      DELIVER_ARTIFACTS: ${{ steps.set-outputs.outputs.DELIVER_ARTIFACTS }}
      RUN_TESTS: ${{ steps.set-outputs.outputs.RUN_TESTS }}
    steps:
    - name: Set output variables
      id: set-outputs
      run: |
        echo "Setting variables ..."
        echo "DELIVER_ARTIFACTS=${{ github.event.inputs.deliver-artifacts || 'yes' }}" >> $GITHUB_OUTPUT
        echo "RUN_TESTS=${{ github.event.inputs.run-tests || 'yes' }}" >> $GITHUB_OUTPUT

  build:
    runs-on: self-hosted
    needs: set-workflow-options
    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: 🛠️ Build project
      run: |
        make render
        make register
        make build
        make run
        make compile
        make reload

  deliver-packages:
    runs-on: self-hosted
    needs: [set-workflow-options,build]
    if: ${{ needs.set-workflow-options.outputs.DELIVER_ARTIFACTS == 'yes' }}
    steps:
    - name: 📦 Generate artifacts
      run: |
        make create-artifact-packages

    - name: 📦 Upload services artifact
      uses: actions/upload-artifact@v4
      with:
        name: ciscolive_demo_packages
        path: preconfigs/ciscolive_demo_packages.tar.gz

  test:
    runs-on: self-hosted
    needs: [set-workflow-options,build]
    if: ${{ needs.set-workflow-options.outputs.RUN_TESTS == 'yes' }}
    steps:
    - name: 🤖 Run tests
      run: |
        make netsims
        make run-tests

  ai-test-analysis:
    runs-on: self-hosted
    needs: test
    if: ${{ always() && needs.test.result == 'failure' }}
    steps:
    - name: 🧠 Analyze test results with AI
      env:
        LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'claude' }}
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_MODEL: ${{ vars.LLM_MODEL || '' }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: make ai-analyze-tests

  deliver-tests:
    runs-on: self-hosted
    needs: test
    steps:
    - name: 📦 Generate artifacts
      run: |
        make create-artifact-tests

    - name: 📦 Upload tests artifact
      uses: actions/upload-artifact@v4
      with:
        name: ciscolive_demo_tests
        path: preconfigs/ciscolive_demo_test.tar.gz

  release:
    runs-on: self-hosted
    needs: [set-workflow-options,deliver-packages,test]
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.set-workflow-options.outputs.DELIVER_ARTIFACTS == 'yes'
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for proper tag detection

      - name: ⭐️ Get latest tag and calculate next version
        id: version
        run: |
          # Fetch all tags
          git fetch --tags
          
          # Get the latest tag matching semantic versioning pattern (v1.0.0)
          LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)
          
          if [ -z "$LATEST_TAG" ]; then
            # No previous tags, start with v1.0.0
            NEW_VERSION="v1.0.0"
            echo "No previous releases found. Starting with $NEW_VERSION"
          else
            echo "Latest release: $LATEST_TAG"
            
            # Extract version numbers (remove 'v' prefix)
            VERSION=${LATEST_TAG#v}
            
            # Split into major.minor.patch
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            
            # Increment patch version (you can change this logic for minor/major bumps)
            PATCH=$((PATCH + 1))
            
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            echo "New version: $NEW_VERSION"
          fi
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "previous_version=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: 📦 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ciscolive_demo_packages
          path: ./artifacts

      - name: ⭐️ Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          name: ⭐️ Release ${{ steps.version.outputs.new_version }}
          tag_name: ${{ steps.version.outputs.new_version }}
          body: |
            🏅 Automated Services Release ${{ steps.version.outputs.new_version }} 🏅
            
            **Branch:** ${{ github.ref_name }}
            **Build:** #${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Previous Version:** ${{ steps.version.outputs.previous_version || 'None' }}
            
            This release includes compiled NSO service packages ready for deployment.
          files: |
            ./artifacts/ciscolive_demo_packages.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    runs-on: self-hosted
    if: always()
    needs: [build,deliver-packages,test,deliver-tests]
    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: 🧹 Cleanup resources
      run: |
        make render
        make deep-clean